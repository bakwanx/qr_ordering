publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  alice: ^1.0.0
  alice_dio: ^1.0.7
  get_it: ^8.0.3
  dio: ^5.8.0+1
  go_router: ^14.8.1
  envied: ^1.3.2
  mobile_scanner: ^6.0.5
  dartz: ^0.10.1
  path: ^1.9.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.10.5
